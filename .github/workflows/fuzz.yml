# Nightly fuzzing of parsers, 5 minutes each (SRS 13.1).
name: fuzz
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/target
            target: FuzzParseURL
          - pkg: ./internal/probe
            target: FuzzDecodeToolsList
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=5m ${{ matrix.pkg }}
