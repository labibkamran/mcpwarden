# golangci-lint v2. Thresholds mirror AGENTS.md section 16 (review triggers).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - funlen
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - nestif
    - noctx
    - revive
    - unconvert
  settings:
    funlen:
      lines: 100
      statements: 60
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 4
  exclusions:
    rules:
      # Table-driven tests are long by design.
      - path: _test\.go
        linters: [funlen]
      # Redaction tests need fake credentials in fixtures.
      - path: _test\.go
        linters: [gosec]
        text: G101
      # A CLI cannot act on a failed write to its own stdout/stderr.
      # Report writers in internal/ must still check every write.
      - path: ^cmd/
        linters: [errcheck]
        text: "fmt\\.Fprint"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/labibkamran/mcpwarden
